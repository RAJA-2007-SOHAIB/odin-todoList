<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Document</title><script defer src=app.bundle.js></script></head><body><div id=content><header class=app-header><h1>🎯 Odin Todo List</h1></header><div class=main-layout><aside class=sidebar><h2>Projects</h2><ul id=project-list></ul><button id=add-project-btn>+ New Project</button></aside><main class=task-viewer><h2 id=current-project-title></h2><div id=task-list></div><button id=add-task-btn>+ Add Task</button></main></div></div><dialog id=project-modal><form method=dialog id=project-form><h3>Create New Project</h3><input id=new-project-name placeholder="Project Name" required><div class=form-actions><button type=button id=close-project-modal>Cancel</button> <button type=submit>Create</button></div></form></dialog><dialog id=task-modal><form method=dialog id=task-form><h3>Add New Task</h3><input id=new-task-title placeholder=Title required> <textarea id=new-task-desc placeholder=Description></textarea> <input type=date id=new-task-date required> <select id=new-task-priority><option value=Low>Low<option value=Medium>Medium<option value=High>High</select><div class=form-actions><button type=button id=close-task-modal>Cancel</button> <button type=submit>Add Task</button></div></form></dialog></body></html>
